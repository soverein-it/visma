# SQL Server from docker-compose.yml. The dummy app and the Visma tables share
# one database per environment, with the Visma tables in the KuraasAS schema
# (matching db/visma_schema.rb). Prepare it with `bundle exec rake visma:db:prepare`.
default: &default
  adapter: sqlserver
  host: <%= ENV.fetch("SQLSERVER_HOST", "localhost") %>
  port: <%= ENV.fetch("SQLSERVER_PORT", 1433) %>
  username: <%= ENV.fetch("SQLSERVER_USERNAME", "sa") %>
  password: <%= ENV.fetch("SQLSERVER_PASSWORD", "Visma_Test_2026") %>
  timeout: 15000

development:
  primary:
    <<: *default
    database: visma_development
  visma:
    <<: *default
    database: visma_development
    database_tasks: false

test:
  primary:
    <<: *default
    database: visma_test
  visma:
    <<: *default
    database: visma_test
    database_tasks: false
